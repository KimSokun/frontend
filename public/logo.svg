<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Circular Ring -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="20" filter="url(#shadow)"/>

  <!-- Inner High-Tech Glow -->
  <circle cx="256" cy="256" r="200" fill="#0B1120" stroke="#334155" stroke-width="4"/>

  <!-- Dynamic S/Swirl/Tool Tech Icon -->
  <path d="M 280,120 C 350,120 400,170 380,240 C 365,290 320,310 280,310 L 220,310 C 190,310 170,330 170,360 C 170,390 200,410 240,410 C 290,410 330,380 340,360 L 375,390 C 350,430 295,450 240,450 C 160,450 120,400 120,345 C 120,285 165,260 210,260 L 270,260 C 305,260 325,245 330,225 C 340,185 305,160 265,160 C 220,160 185,185 170,210 L 135,180 C 165,140 220,120 280,120 Z" 
        fill="url(#glowGrad)"/>

  <!-- Central Spark/Energy Core -->
  <circle cx="256" cy="256" r="24" fill="#38BDF8" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>
</svg>
